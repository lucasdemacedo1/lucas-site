<html lang="en">

<title>1100M Crib Quest</title>

<meta property="og:title" content="1100M Crib Quest">
<meta property="og:description" content="A pixel-art shop game for learning the Tormach 1100M CNC mill.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://lucasdemacedo.dev/TormachQuest/">

<style>
/* Layout: an arcade cabinet. Pixel screen on top, RPG dialog and inventory tray underneath. One committed dark look. */
:root{
  --bg:#10131f; --panel:#1a1e30; --tray:#232842; --ink:#eef0f7; --muted:#a3abc9; --line:#3b4266; --hi:#525b8a; --shade:#080a12;
  --accent:#f4c542; --accent-deep:#b8892a; --accent-ink:#1a1405; --good:#5fd07a; --bad:#ff6b5e; --cyan:#62d6e8;
  --f-display:"Press Start 2P",ui-monospace,"Courier New",monospace;
  --f-body:"VT323",ui-monospace,"SFMono-Regular",Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{background:var(--bg);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
body{background:var(--bg);color:var(--ink);font:22px/1.15 var(--f-body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 48px;
  background-image:radial-gradient(var(--panel) 1px,transparent 1px);background-size:6px 6px}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--cyan);outline-offset:2px}
.cab{max-width:960px;margin:0 auto;display:grid;gap:14px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px 16px;flex-wrap:wrap}
.logo{font:18px/1 var(--f-display);color:var(--accent);text-shadow:3px 3px 0 var(--shade);letter-spacing:.04em;margin:0}
.logo small{display:block;font:9px/1.5 var(--f-display);color:var(--muted);text-shadow:none;margin-top:8px;letter-spacing:.06em}
.hbtns{display:flex;gap:8px;flex-wrap:wrap}
.screen{border:4px solid var(--shade);box-shadow:0 0 0 4px var(--line),0 10px 0 4px var(--shade);background:var(--shade);margin:4px 4px 10px}
#scr{display:block;width:100%;height:auto;aspect-ratio:16/9;image-rendering:pixelated;image-rendering:crisp-edges;cursor:default}
#scr.clicky{cursor:pointer}
.box{background:var(--panel);border:3px solid var(--shade);box-shadow:inset 3px 3px 0 var(--hi),inset -3px -3px 0 var(--line);padding:14px 16px;display:grid;gap:12px;min-width:0}
#panel{display:grid;gap:12px;min-width:0}
.crumb{font:9px/1.5 var(--f-display);color:var(--muted);letter-spacing:.06em;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.crumb b{color:var(--accent);font-weight:400}
.dlg{display:grid;grid-template-columns:72px minmax(0,1fr);gap:14px;align-items:start;cursor:pointer}
.dlg canvas{width:72px;height:72px;image-rendering:pixelated;background:var(--tray);border:3px solid var(--shade)}
.who{font:10px/1 var(--f-display);color:var(--accent);margin:2px 0 8px;letter-spacing:.06em}
.say{font-size:25px;line-height:1.12;text-wrap:pretty;min-height:2.2em}
.say .caret{display:inline-block;width:.5em;height:.9em;background:var(--accent);vertical-align:-2px;margin-left:2px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:760px){.opts.four{grid-template-columns:repeat(4,minmax(0,1fr))}}
.opt{position:relative;display:grid;grid-template-rows:auto 1fr;justify-items:center;gap:6px;text-align:center;background:var(--tray);border:3px solid var(--shade);
  box-shadow:inset 3px 3px 0 var(--hi),inset -3px -3px 0 var(--line);padding:10px 8px 12px;cursor:pointer;font:21px/1.02 var(--f-body);min-height:72px;min-width:0;transition:transform .08s}
.opt.noimg{grid-template-rows:1fr;align-items:center;text-align:left;justify-items:start;padding:12px 30px 12px 12px;font-size:20px}
.opt canvas{width:60px;height:60px;image-rendering:pixelated}
.opt .lbl{min-width:0;overflow-wrap:anywhere}
.opt .k{position:absolute;top:5px;right:6px;font:8px/1 var(--f-display);color:var(--muted)}
.opt:hover:not(:disabled){transform:translateY(-2px);box-shadow:inset 3px 3px 0 var(--accent),inset -3px -3px 0 var(--line)}
.opt:active:not(:disabled){transform:translateY(1px)}
.opt:disabled{cursor:default}
.opt.right{background:color-mix(in srgb,var(--good) 26%,var(--tray));box-shadow:inset 3px 3px 0 var(--good),inset -3px -3px 0 var(--good)}
.opt.wrong{background:color-mix(in srgb,var(--bad) 26%,var(--tray));box-shadow:inset 3px 3px 0 var(--bad),inset -3px -3px 0 var(--bad);animation:shake .3s}
.opt.dim{opacity:.4}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.fb{border-left:6px solid var(--good);padding:4px 0 4px 14px;display:grid;gap:6px}
.fb.miss{border-color:var(--bad)}
.fb h3{font:11px/1.5 var(--f-display);margin:0;color:var(--good);letter-spacing:.04em}
.fb.miss h3{color:var(--bad)}
.fb p{margin:0;max-width:68ch}
.acts{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.pbtn{font:11px/1.2 var(--f-display);letter-spacing:.04em;background:var(--accent);color:var(--accent-ink);border:3px solid var(--shade);box-shadow:inset -3px -3px 0 var(--accent-deep);padding:13px 16px;cursor:pointer}
.pbtn:hover{filter:brightness(1.08)}
.pbtn:active{box-shadow:inset 3px 3px 0 var(--accent-deep)}
.sbtn{font:10px/1.2 var(--f-display);letter-spacing:.04em;background:var(--tray);color:var(--ink);border:3px solid var(--shade);box-shadow:inset 3px 3px 0 var(--hi),inset -3px -3px 0 var(--line);padding:11px 13px;cursor:pointer}
.sbtn:hover{box-shadow:inset 3px 3px 0 var(--accent),inset -3px -3px 0 var(--line)}
.sbtn[aria-pressed="true"]{background:var(--hi)}
.h2{font:13px/1.4 var(--f-display);color:var(--accent);margin:0;letter-spacing:.04em}
.muted{color:var(--muted)}
p{margin:0}
.levels{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.lvl{display:grid;grid-template-columns:52px minmax(0,1fr);gap:4px 12px;align-items:center;text-align:left;background:var(--tray);border:3px solid var(--shade);
  box-shadow:inset 3px 3px 0 var(--hi),inset -3px -3px 0 var(--line);padding:10px;cursor:pointer;min-width:0}
.lvl:hover,.lvl.sel{box-shadow:inset 3px 3px 0 var(--accent),inset -3px -3px 0 var(--line)}
.lvl canvas{width:48px;height:48px;image-rendering:pixelated;grid-row:span 3}
.lvl .nm{font:10px/1.4 var(--f-display);color:var(--ink);letter-spacing:.03em}
.lvl .sub{font-size:19px;line-height:1.05;color:var(--muted)}
.stars{display:flex;gap:4px}
.star{width:14px;height:14px;background:var(--line);clip-path:polygon(50% 0,63% 35%,100% 38%,71% 60%,80% 100%,50% 78%,20% 100%,29% 60%,0 38%,37% 35%)}
.star.on{background:var(--accent)}
.bigstars{display:flex;gap:10px}.bigstars .star{width:40px;height:40px}
.stat{display:flex;gap:22px;flex-wrap:wrap;font-variant-numeric:tabular-nums}
.stat div{display:grid}
.stat b{font:20px/1.2 var(--f-display);color:var(--ink);font-weight:400}
.stat span{font:8px/1.6 var(--f-display);color:var(--muted);letter-spacing:.06em}
.missed{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.missed li{border-bottom:2px dashed var(--line);padding-bottom:10px;display:grid;gap:2px}
.missed .q{color:var(--muted);font-size:19px}
.missed b{color:var(--good);font-weight:400}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:8px/1.3 var(--f-display);background:var(--tray);border:3px solid var(--shade);padding:8px 9px;cursor:pointer;letter-spacing:.03em}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.book{display:grid;gap:0}
.brow{display:grid;grid-template-columns:44px minmax(0,1fr);gap:12px;align-items:center;padding:8px 0;border-bottom:2px dashed var(--line)}
.brow canvas{width:40px;height:40px;image-rendering:pixelated;background:var(--tray);border:2px solid var(--shade)}
.brow .t{font:9px/1.5 var(--f-display);letter-spacing:.03em}
.brow .d{font-size:20px;line-height:1.08}
.brow.locked canvas{filter:brightness(.25) saturate(0)}
.brow.locked .t{color:var(--muted)}
.brow.locked .d{color:var(--muted)}
.cat{font:10px/1 var(--f-display);color:var(--accent);margin:16px 0 4px;display:flex;justify-content:space-between}
.cat small{color:var(--muted);font-size:8px}
.keys{font-size:18px;color:var(--muted)}
.toggle{display:inline-flex;gap:8px;align-items:center;font-size:20px;color:var(--muted);cursor:pointer}
.toggle input{width:18px;height:18px;accent-color:var(--accent)}
.formula{font:9px/1.8 var(--f-display);color:var(--cyan);background:var(--shade);padding:8px 10px;letter-spacing:.03em;overflow-x:auto}
@media (max-width:560px){
  body{font-size:21px}
  .say{font-size:23px}
  .opt{font-size:19px}
  .opt canvas{width:48px;height:48px}
  .dlg{grid-template-columns:54px minmax(0,1fr);gap:10px}
  .dlg canvas{width:54px;height:54px}
  .logo{font-size:14px}
}
.foot{font-size:19px;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px 18px;justify-content:space-between;border-top:2px dashed var(--line);padding-top:12px}
.foot a{color:var(--cyan)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="cab">
  <header class="top">
    <h1 class="logo">CRIB QUEST<small id="tagline">TORMACH 1100M · SHOP TRAINING</small></h1>
    <div class="hbtns">
      <button class="sbtn" id="b-home" type="button">◀ RACKS</button>
      <button class="sbtn" id="b-snd" type="button" aria-pressed="true">SOUND ON</button>
    </div>
  </header>
  <div class="screen"><canvas id="scr" width="320" height="180" role="img" aria-label="Pixel-art machine shop scene"></canvas></div>
  <main id="panel" aria-live="polite"></main>
  <footer class="foot"><span>Open source under the MIT license · <a href="https://github.com/lucasdemacedo1/tormach-quest" target="_blank" rel="noopener">Source on GitHub</a></span><span>Unofficial study game. Not affiliated with or endorsed by Tormach.</span></footer>
</div>

<script>
/* ============ SHOP SETTINGS: change these for your own lab ============
   name   : shown in the header, on the title screen and on the mill (keep it 6 characters or fewer)
   manual : where people should check shop-specific rules
   Progress is saved in the player's browser only (localStorage, keys start with "cq:"). */
const SHOP={
  name:"SSRL",
  manual:"the SSRL safety manual"
};

/* ============ CONTENT: glossary terms and pick-the-tool jobs ============ */
const CATS={mach:"Machine & options",hold:"Tool holding",tool:"Cutting tools",work:"Work holding",meas:"Measuring",ops:"Operation",mat:"Materials"};
const RAW=[
["mach","3-axis mill","Moves the tool relative to the part in X, Y and Z only. No rotation, so each new face of a part needs a new setup."],
["mach","Spindle","The rotating shaft that holds and spins the tool. On the 1100M: 2 hp, up to 7,500 RPM."],
["mach","R8 taper","The taper inside the spindle. On our Tormach it holds the TTS collet."],
["mach","Drawbar","Rod through the spindle that pulls the collet up to clamp the tool holder."],
["mach","Power drawbar","Button-operated drawbar: press to release a tool holder, let go to clamp. We have one."],
["mach","ATC (automatic tool changer)","Carousel that swaps tools by itself. We don't have one, so every tool change is done by hand."],
["mach","4th / 5th axis","Rotary axes that tilt or turn the part during cutting. We don't have either."],
["mach","Enclosure","The box and doors around the mill that keep chips and coolant in. We have one."],
["mach","Flood coolant","Pumped liquid that cools the cut and washes chips away. We have it."],
["mach","PathPilot","Tormach's control software. Loads G-code, stores offsets, runs probing routines."],
["mach","Ways","Precision sliding surfaces the table and head ride on. Keep them oiled and chip-free."],
["mach","Ballscrew","Screw with recirculating balls that turns motor rotation into precise axis motion."],
["mach","T-slot table","Machine table with inverted-T grooves for bolting down vises and clamps."],
["mach","Travel","How far each axis can move. 1100M: 18 × 11 × 16.25 in (X × Y × Z)."],
["mach","Jog","Moving an axis by hand, with keys or the jog shuttle, in set step sizes."],
["mach","E-stop","The big red button. Cuts power to all motion and the spindle immediately."],
["mach","Spindle nose","The bottom face of the spindle. TTS holders seat against it."],
["hold","TTS (Tormach Tooling System)","Quick-change system: every tool lives in a 3/4″-shank holder that seats on the spindle nose, so each tool's length repeats every time it goes in."],
["hold","TTS R8 collet","A shortened 3/4″ R8 collet that stays in the spindle and grips the TTS holder shanks."],
["hold","Tool holder","The piece that grips a cutting tool and mounts it in the spindle."],
["hold","ER collet","Slotted, springy sleeve that squeezes a round shank when its nut is tightened. Low runout; each one grips a small size range."],
["hold","ER collet chuck","Holder with a threaded nose and nut that takes ER collets (ER20 is most common on the Tormach)."],
["hold","Set-screw holder","Holder with a bore and a screw that clamps on the tool's flat. The tool can't pull out, but runout is higher."],
["hold","Weldon flat","Flat ground on a tool shank for a set screw to bear on."],
["hold","Drill chuck","Adjustable three-jaw chuck for drills. Takes side load badly, so never mill with it."],
["hold","Jacobs taper","Short taper that mounts a drill chuck onto its arbor."],
["hold","Shell mill arbor","Holder that mounts a face or shell mill with a bolt through its center."],
["hold","Indexable insert","Replaceable carbide cutting edge screwed into a tool body. Rotate it to a fresh edge when it dulls."],
["hold","Runout","How far off-center a tool spins. Causes uneven flute load, bad finish and short tool life."],
["hold","Stickout","How far the tool sticks out of the holder. Deflection grows with its cube, so keep it short."],
["hold","Tool table","PathPilot's list of every tool number with its length and diameter."],
["hold","Tool length offset","The stored length of a tool, so the control knows where its tip is."],
["hold","Height gauge","Instrument used on a surface plate to measure TTS tool lengths away from the machine."],
["hold","Tool setter (ETS)","A switch on the table that records Z when a tool touches it, to set tool length."],
["tool","Flat (square) end mill","End mill with sharp square corners. Pockets, profiles, slots and flat floors."],
["tool","Bullnose end mill","End mill with a small corner radius. Stronger corners; leaves a small fillet at the floor."],
["tool","Ball end mill","Fully rounded tip. For 3D contoured surfaces."],
["tool","Chamfer mill","Angled cutter for chamfers, deburring edges and spotting holes."],
["tool","Engraving tool","Fine V-pointed cutter for text and thin lines."],
["tool","Thread mill","Cutter that makes a thread by spiraling around the hole. How we thread, since we can't power tap."],
["tool","Fly cutter","Single cutting bit on a wide swinging arm. Faces large flat areas with a great finish."],
["tool","Face mill","Large cutter with several inserts, for facing."],
["tool","Roughing end mill","End mill with serrated (chipbreaker) flutes for removing lots of material quickly."],
["tool","Spot drill","Short, stiff drill that makes a starting dimple so the real drill doesn't wander."],
["tool","Center drill","A lathe tool for center holes. Fragile; use a spot drill on the mill instead."],
["tool","Twist drill","Standard drill. 118° point for general use; 135° split point self-centers."],
["tool","Tap","Threaded tool that cuts or forms internal threads. We only hand tap here."],
["tool","Spiral point tap","Pushes chips ahead of it. For through holes."],
["tool","Spiral flute tap","Pulls chips up and out of the hole. For blind holes."],
["tool","Form (roll) tap","Pushes metal into a thread shape with no chips. Needs a larger drilled hole."],
["tool","Reamer","Finishes a drilled hole to an exact size with a smooth wall."],
["tool","Counterbore","Flat-bottomed step at the top of a hole so a socket head screw sits flush."],
["tool","Countersink","Cone at the top of a hole so a flat head screw sits flush."],
["tool","Flute","Spiral groove on a tool; each carries a cutting edge. More flutes: stronger tool, less room for chips."],
["tool","Helix angle","How twisted the flutes are. High helix clears aluminum chips; low helix suits brass and plastic."],
["tool","Center cutting","End mill whose edges reach the center, so it can plunge straight down."],
["tool","HSS (high-speed steel)","Tough, cheap tool material. Runs about a third as fast as carbide."],
["tool","Carbide","Very hard, stiff tool material. Fast and rigid but brittle; chips on vibration or a crash."],
["tool","Coating","Thin hard layer (TiN, TiAlN, ZrN) for heat and wear resistance. Avoid TiAlN in aluminum."],
["tool","Corner radius","The rounded corner at the tip of an end mill."],
["work","Vise","Clamp bolted to the table that grips the part between two jaws. Our main way to hold parts."],
["work","Fixed jaw","The jaw that doesn't move. It's the reference you indicate and locate from."],
["work","Moving jaw","The jaw that slides when you turn the handle. It lifts slightly as it clamps."],
["work","Parallels","Precision-ground bars that raise the part to a known height in the vise."],
["work","Hard jaws","Hardened steel vise jaws for general work. Can mark the part."],
["work","Soft jaws","Aluminum or plastic jaws machined to the part's shape, for odd shapes and second ops."],
["work","Strap clamp","Bar bolted across a part to hold it on the table when it doesn't fit in a vise."],
["work","Step block","Stepped block that holds up the back (heel) end of a strap clamp at the right height."],
["work","T-slot nut","Nut that slides into the table's T-slot for a stud to thread into."],
["work","Stud","Threaded rod running from the T-slot nut up through the strap clamp."],
["work","Dead blow hammer","Shot-filled mallet for tapping parts down onto parallels without bouncing."],
["work","Vise stop","Adjustable stop on the vise so repeat parts load in exactly the same spot."],
["work","Fixture plate","Plate with tapped holes and dowel holes for locating and bolting down parts."],
["work","Dowel pin","Precision pin that locates parts repeatably."],
["work","Sacrificial plate","Throwaway plate under the part so through-cuts don't hit the table or parallels."],
["work","Indicating the vise","Sweeping the fixed jaw with an indicator and tapping the vise until it's parallel to X."],
["work","Tabs","Small bridges left to hold a cut-out part to the stock, removed afterward."],
["work","Setup","One way of holding the part. Every new orientation is a new setup with its own zero."],
["meas","Caliper","Sliding measuring tool for outsides, insides, depths and steps. Good to about ±0.001″."],
["meas","Micrometer","Screw-based tool for precise outside measurements, to about ±0.0001″. Close it with the ratchet."],
["meas","Feeler gauge","Set of thin leaves of known thickness for measuring gaps."],
["meas","Small hole (ball) gauge","Expands to fit a small hole; you then measure it with a micrometer."],
["meas","Telescoping gauge","Spring-loaded T that locks at a hole's size; you then measure it with a micrometer."],
["meas","Dial bore gauge","Reads a bore's size and roundness against a reference you set it to."],
["meas","Dial test indicator (DTI)","Lever-style indicator for sweeping surfaces: indicating a vise, centering on a bore."],
["meas","Dial indicator","Plunger-style indicator that measures movement along its own axis."],
["meas","Surface plate","Flat granite slab used as the reference surface for measuring."],
["meas","Gauge blocks","Blocks of exact thickness used to set and check measuring instruments."],
["meas","Edge finder","Spinning probe that kicks sideways when it touches an edge, used to find X/Y zero."],
["meas","Passive probe","Wired touch probe (tool 99) that sets work offsets with PathPilot routines. Never spin the spindle with it in."],
["meas","Resolution vs accuracy","Resolution is the smallest step a tool displays; accuracy is how close it is to the true size."],
["meas","10:1 rule","Use a measuring tool at least 10× finer than the tolerance you're checking."],
["meas","Cosine error","An indicator reads high when its stylus is tilted relative to the surface."],
["ops","Referencing (homing)","Driving each axis to its home switch at startup so the machine knows where it is."],
["ops","Machine coordinates","Positions measured from the home switches. They never change."],
["ops","Work offset (G54)","Where your part zero is, measured from machine zero."],
["ops","WCS","Work coordinate system: the part zero you set in Fusion and on the machine. The two must match."],
["ops","Feed hold","Pauses all motion; the spindle keeps turning. Cycle Start resumes."],
["ops","Cycle start","Starts or resumes the program."],
["ops","Stop","Aborts the program and stops the spindle."],
["ops","Feed override","Slider that scales the programmed feed rate. Changes chipload."],
["ops","Spindle override","Slider that scales the spindle RPM."],
["ops","Max velocity override","Caps how fast any move, including rapids, can go. Turn it down for a first run."],
["ops","Single block","Runs one line of code per press of Cycle Start."],
["ops","Optional stop (M01)","Pause point in a program that only stops when the optional-stop switch is on."],
["ops","Air cut","Running a program with Z raised above the part to check the path safely."],
["ops","G-code","The text instructions the machine runs: G0 rapid, G1 feed, G2/G3 arcs."],
["ops","M6","Tool change command. Our mill pauses for you to swap the holder."],
["ops","Toolpath","The route the tool follows, generated in Fusion CAM."],
["ops","Adaptive clearing","Roughing path with deep cuts and small, constant sideways engagement. Easy on a small machine."],
["ops","Climb milling","Tool rotation goes with the feed direction. Better finish; the default on CNC."],
["ops","Conventional milling","Tool rotation works against the feed direction. Used on manual mills with backlash."],
["ops","Peck drilling","Drilling in steps and retracting to clear chips. For holes deeper than about 3× diameter."],
["ops","SFM","Surface feet per minute: how fast the cutting edge moves past the material."],
["ops","RPM","Spindle revolutions per minute. RPM ≈ 3.82 × SFM / diameter."],
["ops","Chipload","Thickness of material each flute takes per revolution."],
["ops","Feed rate","How fast the tool moves through the part, in in/min. Feed = RPM × flutes × chipload."],
["ops","DOC / WOC","Depth of cut (axial, straight down) and width of cut (radial, sideways)."],
["ops","Chatter","Vibration that screeches and leaves a wavy finish. Shorten stickout or change speed or engagement."],
["ops","Built-up edge","Material welding onto the cutting edge, common in aluminum. Ruins the finish."],
["ops","Crash","Tool, holder or spindle hitting something it shouldn't. Usually caused by a wrong offset."],
["mat","6061 aluminum","The default shop material. Cheap and machines easily."],
["mat","7075 aluminum","Stronger aluminum that cuts cleaner but costs more."],
["mat","Delrin (acetal)","The easiest plastic to machine. Holds tolerance well."],
["mat","Free-machining brass (360)","Cuts beautifully but contains about 2% lead. Wash your hands."],
["mat","303 vs 304 stainless","303 is free-machining. 304 work-hardens and is tougher to cut."],
["mat","Work hardening","Some metals, like stainless, get harder where the tool rubs. Keep the tool cutting, never dwelling."],
